font_family CaskaydiaCove NF
bold_font auto
italic_font auto
bold_italic_font auto

window_padding_with 12
hide_window_decorations yes
remember_window_size no

background #0b0e0c
foreground #c4cec5
background_opacity 1.0

shell_integration no-cursor
cursor_shape block
cursor #bd7474
cursor_text_color #111713
cursor_blink_interval 0.5

selection_background #29352c
selection_foreground #ffffff

# theme
color0 #111713
color8 #465349
color1 #bd7474
color9 #d58b8b
color2 #78a982
color10 #91db9a
color3 #c5a66b
color11 #d9bc83
color4 #728da0
color12 #8ba9bd
color5 #987f9f
color13 #b09ab7
color6 #6e9991
color14 #8db7ac
color7 #c4cec5
color15 #e0e8e0

url_color #78a982
detect_urls yes
