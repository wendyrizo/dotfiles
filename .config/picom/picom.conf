backend = "glx";
vsync = true;

# sombras
shadow = true;
shadow-radius = 10;
shadow-offset-x = 0;
shadow-offset-y = 3;
shadow-opacity = 0.20;
shadow-color = "000000";

shadow-exclude = [
    "class_g = 'i3blocks'"
];

# opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# reglas
opacity-rule = [
    "90:class_g = 'kitty'",
];
